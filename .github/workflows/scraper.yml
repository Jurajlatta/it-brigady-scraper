name: IT Brigády Scraper

on:
  workflow_dispatch: # Umožňuje manuálne spustenie z GitHub Actions rozhrania
    inputs:
      dry_run:
        description: 'Testovací beh (nič sa neodošle ani neuloží)'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-22.04

    # Pridáme práva na commit späť do repozitára
    permissions:
      contents: write

    steps:
    - name: Checkout repozitára
      uses: actions/checkout@v4

    - name: Nastavenie Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Inštalácia Node dependencií
      run: npm install

    - name: Spustenie scrapera
      run: node scraper.js ${{ inputs.dry_run && '--dry-run' || '' }}
      env:
        # Discord webhook je uložený ako GitHub Secret "DISCORD_WEBHOOK_URL" (nikdy nie v kóde).
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # Voliteľné: ak ho nastavíš, požiadavky idú cez ScraperAPI. Bez neho sa stránky sťahujú priamo.
        SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}

    - name: Git commit a push (videl_som.json)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add videl_som.json
        # Ak nie sú žiadne zmeny (nenašla sa nová brigáda), nič sa necommitne
        git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizácia videných inzerátov [skip ci]" && git push)
